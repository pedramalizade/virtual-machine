<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="pannellum.css">

    <style>
        html, body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
        }

        #panorama{
            width:100%;
            height:100vh;
        }

        .pnlm-container{
            background: url("loadingpages.png") no-repeat !important;
            background-size: cover !important;
        }

        .pnlm-load-box.loading-text{
            left:50% !important;
            top:50% !important;
            transform:translate(-50%,-50%) !important;
            margin:0 !important;
            width:750px;
            max-width:90vw;
            min-height:260px;
            height:auto;
            padding:30px 40px;
            background:rgba(0,0,0,.45);
            border-radius:18px;
            box-sizing:border-box;
        }

        .pnlm-load-box p{
            color:white !important;
            font-size:22px !important;
            line-height:2.2 !important;
            text-align:center;
            margin:0 0 25px 0 !important;
            font-family:tahoma;
            white-space:normal;
            word-break:break-word;
            overflow-wrap:anywhere;
        }

        .pnlm-lbar{
            width:180px;
            margin:25px auto 0 auto !important;
        }

        .pnlm-lbar-fill{
            background:white !important;
        }

        #logo{
            position:fixed;
            top:20px;
            right:20px;
            width:90px;
            height:auto;
            z-index:9999;
            pointer-events:none;
            opacity:0.95;
        }
    </style>

/* ================================================= */
/* نمایش مختصات با کلیک راست */
/* ================================================= */

document.getElementById('panorama').addEventListener(
    'contextmenu',
    function(e) {

        e.preventDefault();

        const coords = viewer.mouseEventToCoords(e);

        console.log(
            "Pitch: " +
            coords[0].toFixed(2) +
            " | Yaw: " +
            coords[1].toFixed(2)
        );

    }
);


/* ================================================= */
/* متن هنگام تغییر تصویر */
/* ================================================= */

viewer.on("scenechange", function(sceneId) {

    setTimeout(function() {

        const box = document.querySelector(".pnlm-load-box");

        const p = box
            ? box.querySelector("p:first-child")
            : null;

        if(box)
            box.classList.add("loading-text");

        if(p && sceneTexts[sceneId])
            p.textContent = sceneTexts[sceneId];

    }, 10);

});


/* ================================================= */
/* مدیریت Loading اولیه */
/* ================================================= */

const loadButtonWatcher = setInterval(function() {

    const btn = document.querySelector(".pnlm-load-button");

    if(btn) {

        btn.addEventListener(
            "click",
            function() {

                const waitForBox = setInterval(function() {

                    const box =
                        document.querySelector(".pnlm-load-box");

                    const p =
                        box
                            ? box.querySelector("p:first-child")
                            : null;

                    if(box && p) {

                        box.classList.add("loading-text");

                        p.textContent =
                            sceneTexts["room1"];

                        clearInterval(waitForBox);
                    }

                }, 10);

            },
            { once:true }
        );

        clearInterval(loadButtonWatcher);
    }

}, 10);


/* ================================================= */
/* پایان Loading */
/* ================================================= */

viewer.on("load", function() {

    setTimeout(function() {

        const box =
            document.querySelector(".pnlm-load-box");

        if(box)
            box.classList.remove("loading-text");

    }, 100);

});
